name: Update Submodules Sequentially

on:
  # 1. 수동 실행 (원할 때 클릭 한 번으로 실행)
  workflow_dispatch:
  # 2. 자동 감지 (1시간마다 변경 사항 확인)
  schedule:
    - cron: '0 * * * *'

# 중복 실행 방지
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          # 서브모듈 내용은 가져오지 않고, 포인터(설정)만 가져옵니다.
          submodules: false 
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Iterate & Update Submodules
        run: |
          UPDATED_MODULES=""
          
          # .gitmodules 파일을 파싱하여 등록된 모든 서브모듈을 순차적으로 처리합니다.
          # 파이프(| while) 대신 프로세스 치환(< <(...))을 사용하여 변수 스코프 유지
          while read -r key; do
            # 1. 서브모듈 정보 추출
            path=$(git config --file .gitmodules "$key")
            name=$(echo "$key" | sed 's/^submodule\.//;s/\.path$//')
            
            # .gitmodules에 명시된 branch 정보를 가져옵니다 (없으면 HEAD 사용)
            branch_key="submodule.$name.branch"
            target_branch=$(git config --file .gitmodules "$branch_key" || echo "HEAD")

            echo "=================================================="
            echo "🔍 Checking submodule: '$name'"
            echo "   - Path: $path"
            echo "   - Tracking Branch: $target_branch"
            
            # 2. 해당 서브모듈 초기화 및 업데이트
            git submodule update --init -- "$path"
            git submodule update --remote "$path"
            
            # 3. 변경 사항 감지
            if [[ -n $(git status --porcelain "$path") ]]; then
              echo "✅ Change detected in '$name'!"
              git add "$path"
              
              # 업데이트된 모듈 목록에 추가
              if [ -z "$UPDATED_MODULES" ]; then
                UPDATED_MODULES="$name"
              else
                UPDATED_MODULES="$UPDATED_MODULES, $name"
              fi
            else
              echo "💤 No changes in '$name'."
            fi
          done < <(git config --file .gitmodules --name-only --get-regexp path)

          # 4. 수집된 목록이 있으면 단일 커밋 생성
          if [[ -n "$UPDATED_MODULES" ]]; then
            echo "📝 Committing updates for: $UPDATED_MODULES"
            git commit -m "[UPDATE] submodule $UPDATED_MODULES 업데이트"
          else
            echo "Everything is up to date. No commit needed."
          fi

      - name: Push Changes
        run: |
          # 커밋된 내용이 있을 때만 푸시
          if [[ -n $(git cherry -v) ]]; then
            echo "🚀 Pushing updates to main branch..."
            git push
          else
            echo "Everything is up to date."
          fi
